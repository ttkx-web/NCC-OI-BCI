[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-dayloop"
version = "0.1.0"
description = "Day-one BNCI2014-001 to LaBraM linear-probe BCI pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
  "h5py>=3.10",
  "mne>=1.6",
  "numpy==1.26.4",
  "pyedflib>=0.1.36",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  # CUDA wheel selection is platform-specific; see docs/server_deployment.md.
  "torch>=2.5",
]

[project.optional-dependencies]
data = ["moabb>=1.1"]
ui = ["pandas>=2.0", "streamlit>=1.39"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"
