[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-dayloop"
version = "0.1.0"
description = "Day-one BNCI2014-001 to LaBraM linear-probe BCI pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
  "h5py>=3.10",
  "mne>=1.6",
  "numpy==1.26.4",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "streamlit>=1.39",
  "torch>=2.0.1,<2.1",
  "torchvision==0.15.2",
  "torchaudio==2.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Tests import both installable sources and repository-owned script modules.
pythonpath = ["src", "."]
testpaths = ["tests"]
# The repository resides on an external macOS volume in supported developer
# setups; use a local temp directory to avoid AppleDouble sidecar artifacts.
addopts = "-ra --basetemp=/tmp/ncc-oi-bci-pytest"
